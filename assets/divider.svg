<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#58a6ff" stop-opacity=".65"/>
      <stop offset="0.5" stop-color="#bc8cff" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#58a6ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="35" y1="17" x2="1165" y2="17" stroke="#30363d" stroke-width="1"/>
  <line x1="35" y1="17" x2="1165" y2="17" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 170">
    <animate attributeName="stroke-dashoffset" from="0" to="-1040" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cx="600" cy="17" r="3.5" fill="#58a6ff">
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
