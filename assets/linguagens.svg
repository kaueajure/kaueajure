<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-label="Linguagens: aguardando configuracao">
<title>Linguagens dos projetos aguardando configuracao</title>
<rect x="0.5" y="0.5" width="839" height="229" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="30" y="46" fill="#58a6ff" font-size="18" font-weight="bold" font-family="Arial,sans-serif">LINGUAGENS NOS PROJETOS</text>
<text x="30" y="111" fill="#f0f6fc" font-size="27" font-weight="bold" font-family="Arial,sans-serif">Aguardando leitura autorizada</text>
<text x="30" y="153" fill="#8b949e" font-size="16" font-family="Arial,sans-serif">Grafico gerado a partir do codigo de projetos publicos e privados.</text>
<text x="30" y="200" fill="#8b949e" font-size="12" font-family="Arial,sans-serif">Nomes e arquivos de repositorios privados nao sao publicados neste cartao.</text>
</svg>
