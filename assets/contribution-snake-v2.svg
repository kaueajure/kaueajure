<svg xmlns="http://www.w3.org/2000/svg" width="620" height="102" viewBox="0 0 620 102" role="img" aria-label="GitHub contribution snake animation">
<style>
  .c0{fill:#ebedf0}.c1{fill:#9be9a8}.c2{fill:#40c463}.c3{fill:#30a14e}.c4{fill:#216e39}
  .label{fill:#57606a;font:8px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .body{fill:none;stroke:#2da44e;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;pathLength:1000;stroke-dasharray:92 908}
  .head{fill:#2da44e;stroke:#1a7f37;stroke-width:1}
  .eye{fill:#fff}.pupil{fill:#24292f}
  @media(prefers-color-scheme:dark){
    .c0{fill:#161b22}.c1{fill:#0e4429}.c2{fill:#006d32}.c3{fill:#26a641}.c4{fill:#39d353}
    .label{fill:#8b949e}.body{stroke:#39d353}.head{fill:#39d353;stroke:#2ea043}.pupil{fill:#0d1117}
  }
</style>
<defs>
  <pattern id="grid" width="11" height="11" patternUnits="userSpaceOnUse">
