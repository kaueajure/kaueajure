<svg xmlns="http://www.w3.org/2000/svg" width="720" height="112" viewBox="0 0 720 112" role="img" aria-label="GitHub contribution snake animation">
<style>
  .c0{fill:#ebedf0} .c1{fill:#9be9a8} .c2{fill:#40c463} .c3{fill:#30a14e} .c4{fill:#216e39}
  .label{fill:#57606a;font:9px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .body{fill:none;stroke:#2da44e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;pathLength:1000;stroke-dasharray:72 928}
  .head{fill:#2da44e;stroke:#1a7f37;stroke-width:1.2}
  .eye{fill:#fff} .pupil{fill:#24292f}
  @media(prefers-color-scheme:dark){
    .c0{fill:#161b22} .c1{fill:#0e4429} .c2{fill:#006d32} .c3{fill:#26a641} .c4{fill:#39d353}
    .label{fill:#8b949e} .body{stroke:#39d353} .head{fill:#39d353;stroke:#2ea043} .pupil{fill:#0d1117}
  }
</style>
<defs>
  <pattern id="grid" width="11" height="11" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" rx="2" class="c0"/>
  </pattern>
  <path id="snakeRoute" d="M 78 52 L 78 74 L 89 52 L 89 96 L 111 63 L 111 41 L 122 63 L 133 52 L 133 96 L 144 74 L 166 74 L 166 96 L 177 52 L 199 30 L 210 52 L 210 74 L 210 85 L 221 41 L 276 63 L 287 52 L 287 74 L 320 74 L 342 52 L 342 96 L 353 63 L 364 41 L 375 63 L 397 96 L 430 52 L 452 63 L 474 63 L 529 63" pathLength="1000"/>
